<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Clone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Elemento de áudio -->
  <audio id="audioPlayer"></audio>

  <div class="spotify-layout">
    
    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="sidebar">
      <nav class="nav-block">
        <ul>
          <li>
            <a href="#" id="btnNavHome" class="active">
              <i class="fa-solid fa-house"></i>
              <span>Início</span>
            </a>
          </li>
          <li>
            <a href="admin.html">
              <i class="fa-solid fa-sliders"></i>
              <span>Painel do Criador</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="library-block">
        <div class="library-header">
          <button class="lib-btn">
            <i class="fa-solid fa-book"></i>
            <span>A tua Biblioteca</span>
          </button>
          <button class="icon-only-btn"><i class="fa-solid fa-plus"></i></button>
        </div>

        <div class="library-list">
          <div id="btnNavLiked" class="lib-item">
            <div class="lib-icon-box">
              <i class="fa-solid fa-heart"></i>
            </div>
            <div class="lib-info">
              <span class="title">Músicas Curtidas</span>
              <span class="sub" id="likedCountText">Playlist • 0 músicas</span>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL (MAIN VIEW) -->
    <main class="main-view">
      <header class="top-nav">
        <div class="nav-arrows">
        </div>
        <button class="profile-btn"><i class="fa-solid fa-user"></i></button>
      </header>

      <div class="content-container">
        <!-- VISTA 1: INÍCIO (MÚSICAS DISPONÍVEIS) -->
        <section id="homeView" class="view-section">
          <div class="section-header">
            <h2>Músicas Disponíveis</h2>
          </div>
          <div id="songGrid" class="song-grid">
            <!-- Músicas carregadas via JavaScript -->
          </div>
        </section>

        <!-- VISTA 2: MÚSICAS CURTIDAS -->
        <section id="likedView" class="view-section hidden">
          <div class="liked-banner">
            <div class="liked-cover-large">
              <i class="fa-solid fa-heart"></i>
            </div>
            <div class="liked-details">
              <span class="badge">PLAYLIST</span>
              <h1>Músicas Curtidas</h1>
              <p id="likedBannerSubtitle">0 músicas</p>
            </div>
          </div>

          <div id="likedSongGrid" class="song-grid">
            <!-- Músicas curtidas carregadas via JavaScript -->
          </div>
        </section>
      </div>
    </main>

    <!-- PLAYER INFERIOR -->
    <footer class="player-bar">
      <div class="now-playing">
        <div class="cover-container">
          <img id="currentCover" src="https://via.placeholder.com/56" alt="Capa" />
        </div>
        <div class="track-details">
          <span id="currentTitle" class="track-title">Selecione uma música</span>
          <span id="currentArtist" class="track-artist">-</span>
        </div>
        <button id="playerHeartBtn" class="icon-btn heart-btn" title="Curtir">
          <i class="fa-regular fa-heart"></i>
        </button>
      </div>

      <div class="player-center">
        <div class="player-controls">
          <button id="shuffleBtn" class="icon-btn"><i class="fa-solid fa-shuffle"></i></button>
          <button id="prevBtn" class="icon-btn"><i class="fa-solid fa-backward-step"></i></button>
          <button id="playBtn" class="play-main-btn"><i class="fa-solid fa-play"></i></button>
          <button id="nextBtn" class="icon-btn"><i class="fa-solid fa-forward-step"></i></button>
          <button id="repeatBtn" class="icon-btn"><i class="fa-solid fa-repeat"></i></button>
        </div>
        <div class="progress-bar-wrapper">
          <span id="currentTime" class="time">0:00</span>
          <div class="range-slider">
            <input type="range" id="progressBar" value="0" min="0" max="100">
          </div>
          <span id="totalDuration" class="time">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <div class="volume-wrapper">
          <i class="fa-solid fa-volume-high" style="color: var(--text-gray); font-size: 0.85rem;"></i>
          <input type="range" id="volumeSlider" value="80" min="0" max="100">
        </div>
      </div>
    </footer>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
