<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <!-- Define o idioma, o título e os arquivos visuais da página. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Clone</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="views/style.css">
</head>
<body>
  <!-- O navegador toca aqui o áudio da música escolhida. -->
  <audio id="audioPlayer"></audio>

  <div class="spotify-layout">
    <!-- Menu para abrir as músicas, as curtidas ou o painel do criador. -->
    <aside class="sidebar">
     <nav class="nav-block">
  <ul>
    <li>
      <a href="#" id="btnNavHome" class="active">
        <i class="fa-solid fa-house"></i>
        <span>Início</span>
      </a>
    </li>
    <li>
      <a href="#" id="btnNavLiked">
        <i class="fa-solid fa-heart"></i>
        <span>Curtidas</span>
      </a>
    </li>

    <li>
      <a href="admin.html">
        <i class="fa-solid fa-sliders"></i>
        <span>Painel do Criador</span>
      </a>
    </li>
  </ul>
</nav>
      <div class="library-block">
        <div class="library-header">
          <button class="lib-btn">
            <i class="fa-solid fa-book"></i>
            <span>A tua Biblioteca</span>
          </button>
          <button class="icon-only-btn"><i class="fa-solid fa-plus"></i></button>
        </div>

        <div class="library-list">
          <div id="btnNavLiked" class="lib-item">
            <div class="lib-icon-box">
              <i class="fa-solid fa-heart"></i>
            </div>
            <div class="lib-info">
              <span class="title">Músicas Curtidas</span>
              <span class="sub" id="likedCountText">Playlist • 0 músicas</span>
            </div>
          </div>
        </div>
      </div>
    </aside>
    <!-- As listas de músicas aparecem nesta parte da página. -->
    <main class="main-view">
      <header class="top-nav">
        <div class="nav-arrows">
          <button class="circle-btn"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="circle-btn"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <button class="profile-btn"><i class="fa-solid fa-user"></i></button>
      </header>

      <div class="content-container">
        <section id="homeView" class="view-section">
          <div class="section-header">
            <h2>Músicas Disponíveis</h2>
          </div>
          <div id="songGrid" class="song-grid">
          </div>
        </section>
        <section id="likedView" class="view-section hidden">
          <div class="liked-banner">
            <div class="liked-cover-large">
              <i class="fa-solid fa-heart"></i>
            </div>
            <div class="liked-details">
              <span class="badge">PLAYLIST</span>
              <h1>Músicas Curtidas</h1>
              <p id="likedBannerSubtitle">0 músicas</p>
            </div>
          </div>

          <div id="likedSongGrid" class="song-grid">
          </div>
        </section>
      </div>
    </main>
    <!-- Aqui aparecem a música atual, os controles e o progresso. -->
    <footer class="player-bar">
      <div class="now-playing">
        <div class="cover-container">
          <img id="currentCover" src="assets/cover-placeholder.svg" alt="Capa" />
        </div>
        <div class="track-details">
          <span id="currentTitle" class="track-title">Selecione uma música</span>
          <span id="currentArtist" class="track-artist">-</span>
        </div>
        <button id="playerHeartBtn" class="icon-btn heart-btn" title="Curtir">
          <i class="fa-regular fa-heart"></i>
        </button>
      </div>
      <div class="player-center">
        <div class="player-controls">
          <button id="shuffleBtn" class="icon-btn"><i class="fa-solid fa-shuffle"></i></button>
          <button id="prevBtn" class="icon-btn"><i class="fa-solid fa-backward-step"></i></button>
          <button id="playBtn" class="play-main-btn"><i class="fa-solid fa-play"></i></button>
          <button id="nextBtn" class="icon-btn"><i class="fa-solid fa-forward-step"></i></button>
          <button id="repeatBtn" class="icon-btn"><i class="fa-solid fa-repeat"></i></button>
        </div>
        <div class="progress-bar-wrapper">
          <span id="currentTime" class="time">0:00</span>
          <div class="range-slider">
            <input type="range" id="progressBar" value="0" min="0" max="100">
          </div>
          <span id="totalDuration" class="time">0:00</span>
        </div>
      </div>
      <div class="player-right">
        <div class="volume-wrapper">
          <button id="volumeBtn" class="icon-btn" title="Volume">
            <i class="fa-solid fa-volume-high"></i>
          </button>
          <input type="range" id="volumeSlider" value="80" min="0" max="100">
        </div>
      </div>
    </footer>

  </div>
  <!-- Inicia o player e registra o recurso que ajuda a página a abrir sem internet. -->
  <script type="module">
    // Carrega as funções que ligam os botões aos dados e à tela.
    import { iniciarPlayer } from "./controllers/player-controller.js";

    iniciarPlayer();

    // Registra o arquivo que guarda cópias do site para uso sem internet.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js")
        .then((registration) => console.log("Service Worker registrado:", registration.scope))
        .catch((error) => console.error("Erro ao registrar Service Worker:", error));
    }
  </script>
</body>
</html>
